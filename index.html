<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Seto Yoki — Full-Stack Developer &amp; UI/UX Engineer</title>
    <meta
      name="description"
      content="Full-stack developer building fast, accessible web products with React, Node.js and TypeScript. Browse selected work, experience and contact details."
    />
    <!--
      BEFORE DEPLOYING: replace every https://example.com/ below with your real
      domain, and add public/og.png (1200x630) - social cards need an absolute
      URL to a real image, so these tags do nothing until both are done.
    -->
    <link rel="canonical" href="https://example.com/" />
    <meta name="theme-color" content="#04081A" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://example.com/" />
    <meta property="og:title" content="Seto Yoki — Full-Stack Developer &amp; UI/UX Engineer" />
    <meta
      property="og:description"
      content="Full-stack developer building fast, accessible web products with React, Node.js and TypeScript."
    />
    <meta property="og:image" content="https://example.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Seto Yoki — Full-Stack Developer &amp; UI/UX Engineer" />
    <meta
      name="twitter:description"
      content="Full-stack developer building fast, accessible web products with React, Node.js and TypeScript."
    />
    <meta name="twitter:image" content="https://example.com/og.png" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
